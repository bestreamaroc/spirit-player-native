name: Build Spirit Player Native APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure fallback icon and TV banner exist
        run: |
          mkdir -p app/src/main/res/drawable
          if [ ! -f app/src/main/res/drawable/ic_launcher.png ]; then
            cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <solid android:color="#d92b4b"/>
            <corners android:radius="16dp"/>
          </shape>
          EOF
          fi
          if [ ! -f app/src/main/res/drawable/tv_banner.png ]; then
            cat << 'EOF' > app/src/main/res/drawable/tv_banner.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <gradient android:startColor="#0ea5e9" android:endColor="#9333ea" android:angle="45"/>
          </shape>
          EOF
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spirit-player-native-apk
          path: app/build/outputs/apk/debug/app-debug.apk
